<html>

<script src="scripts/workout-time-limits.js"></script>
<script src="scripts/default-exercise-names.js"></script>
<script src="scripts/clock.js"></script>
<script src="scripts/exercise-storage.js"></script>
<script src="scripts/workout-time-storage.js"></script>
<script src="scripts/exercise-name-rules.js"></script>
<script src="scripts/page-text-escaping.js"></script>
<script src="scripts/elapsed-time-text.js"></script>
<script src="scripts/exercise-row-colours.js"></script>
<script src="scripts/workout-rules.js"></script>
<script src="scripts/exercise-list-display.js"></script>
<script src="scripts/exercise-dialogs.js"></script>
<script src="scripts/workout-time-display.js"></script>
<script src="scripts/button-press-handlers.js"></script>
<script src="scripts/rename-exercise-flow.js"></script>
<script src="scripts/add-exercise-flow.js"></script>
<script src="scripts/delete-exercise-flow.js"></script>
<script src="scripts/app-start.js"></script>

<head>
    <link rel="stylesheet" href="exercise.tracker.css">
</head>

<body style="background-color: black;">
    <strong>
        <div id="mainDiv">
            <div class="timesDiv>">
                <label class="dispTime" id="settingsBtn" onmousedown="eventHandlerHighlightSettingsGearBtn(this)"
                        onmouseup="eventHandlerOpenSettings(this)">&nbsp;&#9881;&nbsp;</label>
                <label class="dispTime">Worked:</label>
                <label class="dispTime" id="currentWorkoutTime">00s</label>
            </div>

            <div class="exerciseListDiv" id="exerciseListDiv">
                <!-- this is filled dynamically on page load -->
                <!-- this hold the list of exercises-->
            </div>
<!--
            <div style="display:none" class="exerciseListDiv" id="backupExerciseList">
            </div>
        -->

            <div class="exerciseActionsModal" id="exerciseActionsModal" style="display: none;">
                <p class="exerciseModalText" id="exerciseModalText"> Some Exercise Name Here </p>
                <p> <label class="exerciseModalBtn" id="addSetBtn" onmousedown="eventHandlerAddSet(this)"
                        onmouseup="eventHandlerFinishExerciseActionsModalBtn(this)">Add Set</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="delSetBtn" onmousedown="eventHandlerDelSet(this)"
                        onmouseup="eventHandlerFinishExerciseActionsModalBtn(this)">Del Set</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="cancelBtn" onmousedown="eventHandlerCancelSet(this)"
                        onmouseup="eventHandlerFinishExerciseActionsModalBtn(this)">Cancel</label><br /> </p>
            </div>

            <div class="exerciseActionsModal" id="settingsModal" style="display: none;">
                <p class="exerciseModalText">Settings</p>
                <p> <label class="exerciseModalBtn" id="closeSettingsBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerReturnToListFromSettings(this)">Go Back</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="addExerciseBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerOpenAddExercise(this)">Add New Exer</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="renameExerciseBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerOpenRenamePicker(this)">Rename Exer</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="deleteExerciseBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerOpenDeletePicker(this)">Delete Exer</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="resetBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerAskToConfirmReset(this)">Reset Everything</label><br /> </p>
            </div>

            <div class="exerciseActionsModal" id="addExerciseModal" style="display: none;">
                <p class="exerciseModalText">Add:</p>
                <p> <input class="exerciseNameInput" id="addNameInput" type="text" maxlength="12" autocomplete="off"> </p>
                <p class="exerciseModalText" id="addMessage"></p>
                <p> <label class="exerciseModalBtn" id="addConfirmBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerAddNewExercise(this)">Add</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="addBackBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackFromAddExercise(this)">Go Back</label><br /> </p>
            </div>

            <div class="exerciseActionsModal" id="renamePickerModal" style="display: none;">
                <p class="exerciseModalText">Rename:</p>
                <p> <label class="exerciseModalBtn" id="renamePickerBackBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackFromRenamePicker(this)">Go Back</label><br /> </p>
                <div id="renamePickerList">
                    <!-- filled with one row per exercise when the picker opens -->
                </div>
            </div>

            <div class="exerciseActionsModal" id="renameEntryModal" style="display: none;">
                <p class="exerciseModalText">New name:</p>
                <p> <input class="exerciseNameInput" id="renameNameInput" type="text" maxlength="12" autocomplete="off"> </p>
                <p class="exerciseModalText" id="renameMessage"></p>
                <p> <label class="exerciseModalBtn" id="renameNextBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerCheckNewExerciseName(this)">Next</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="renameEntryBackBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackFromRenameEntry(this)">Go Back</label><br /> </p>
            </div>

            <!-- the save button's text, and whether Clear Set Hist shows, depend on whether the
                 exercise has any history. the app sets both when this dialog opens -->
            <div class="exerciseActionsModal" id="renameSetsModal" style="display: none;">
                <p class="exerciseModalText" id="renameSetsTitle"> New Name Here </p>
                <p> <label class="exerciseModalBtn" id="keepSetsBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerKeepSetsOfRenamedExercise(this)">Save Set Hist</label><br /> </p>
                <p id="clearSetsRow"> <label class="exerciseModalBtn" id="clearSetsBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerClearSetsOfRenamedExercise(this)">Clear Set Hist</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="renameSetsBackBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackFromRenameSets(this)">Go Back</label><br /> </p>
            </div>

            <div class="exerciseActionsModal" id="deletePickerModal" style="display: none;">
                <p class="exerciseModalText">Delete:</p>
                <p> <label class="exerciseModalBtn" id="deletePickerBackBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackFromDeletePicker(this)">Go Back</label><br /> </p>
                <div id="deletePickerList">
                    <!-- filled with one row per exercise when the picker opens -->
                </div>
            </div>

            <!-- the title is the name alone, so Yes sits level with the picker's Go Back, above the
                 picker's exercise rows, when the picker was not scrolled -->
            <div class="exerciseActionsModal" id="deleteConfirmationModal" style="display: none;">
                <p class="exerciseModalText" id="deleteConfirmationTitle"> Exercise Name Here </p>
                <p> <label class="exerciseModalBtn" id="confirmDeleteBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerDeleteExercise(this)">Yes, Delete</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="cancelDeleteBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackFromDeleteConfirmation(this)">Go Back</label><br /> </p>
            </div>

            <!-- Reset Everything is the last Settings button, and this dialog has only two, so an
                 accidental double tap cannot land on Yes -->
            <div class="exerciseActionsModal" id="resetConfirmationModal" style="display: none;">
                <p class="exerciseModalText">Reset all?</p>
                <p> <label class="exerciseModalBtn" id="confirmResetBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerResetLocalStorage(this)">Yes, Reset</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="cancelResetBtn"
                        onmousedown="eventHandlerHighlightSettingsDialogBtn(this)"
                        onmouseup="eventHandlerGoBackToSettings(this)">Go Back</label><br /> </p>
            </div>

            <div class="exerciseActionsModal" id="isItNewWorkoutModal" style="display: none;">
                <p class="exerciseModalText" id="isItNewWorkoutModalText"> Some Exercise Name Here </p>
                <p> <label class="exerciseModalBtn" id="yesNewWorkoutBtn"
                        onmousedown="eventHandlerHighlightWorkoutChoiceBtn(this)"
                        onmouseup="eventHandlerStartNewWorkout(this)">New Workout</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="noNewWorkoutBtn"
                        onmousedown="eventHandlerHighlightWorkoutChoiceBtn(this)"
                        onmouseup="eventHandlerContinueSameWorkout(this)">Same Workout</label><br /> </p>
                <p> <label class="exerciseModalBtn" id="cancelDecidingNewWorkoutBtn"
                        onmousedown="eventHandlerCancelDecidingIsItNewWorkout(this)"
                        onmouseup="eventHandlerGoBackFromIsItNewWorkoutModalBtn(this)">Go Back</label><br /> </p>
            </div>


        </div>
    </strong>
</body>


</html>
